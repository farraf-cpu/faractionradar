name: Predict BCCH TPM (Monetary Policy Rate)

on:
  schedule:
    - cron: '30 18 * * *'
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      force_release_date:
        description: 'Override BCCH release date (YYYY-MM-DD).'
        required: false
      force_days_out:
        description: 'Override days_out (1|2|3|4|7).'
        required: false

concurrency:
  group: predict-bcch
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      bcch_release_date: ${{ steps.check.outputs.bcch_release_date }}
      bcch_days_out: ${{ steps.check.outputs.bcch_days_out }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Decide if today is an BCCH predict day
        id: check
        run: |
          if [ -n "${{ github.event.inputs.force_release_date }}" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "bcch_release_date=${{ github.event.inputs.force_release_date }}" >> "$GITHUB_OUTPUT"
            echo "bcch_days_out=${{ github.event.inputs.force_days_out }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python scripts/should_run_bcch.py; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  predict:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch live BCCH consensus from worker
        id: consensus
        env:
          CALENDAR_AUTH_KEY: ${{ secrets.CALENDAR_AUTH_KEY }}
          BCCH_RELEASE_DATE: ${{ needs.gate.outputs.bcch_release_date }}
        run: |
          python - <<'PY'
          import json, os, re, sys, urllib.parse, urllib.request
          key = os.environ["CALENDAR_AUTH_KEY"]
          rel = os.environ["BCCH_RELEASE_DATE"]
          url = ("https://faractionradar-calendar.faractionradar.workers.dev/"
                 f"?key={urllib.parse.quote(key)}&read")
          req = urllib.request.Request(url, headers={
              "user-agent": "Mozilla/5.0 (X11; Linux x86_64; rv:129.0) Gecko/20100101 Firefox/129.0",
          })
          data = json.loads(urllib.request.urlopen(req, timeout=30).read())
          events = data.get("events", [])

          def is_bcch(title: str) -> bool:
              t = (title or "").strip().lower()
              return bool(re.match(r"^(bcch\s+)?cash\s+rate$|^bcch\s+monetary\s+policy\s+statement$|^bcch\s+rate\s+statement$", t))

          matches = [
              e for e in events
              if e.get("country") == "CLP"
              and is_bcch(e.get("title") or "")
              and (e.get("date") or "").startswith(rel)
          ]

          if not matches:
              print(f"::notice::no BCCH in worker /?read for {rel}")
              sys.exit(0)
          ev = matches[0]

          def parse_pct(s):
              if not s: return None
              m = re.match(r"^([-+]?\d+(?:\.\d+)?)%?$", s.strip())
              return float(m.group(1)) if m else None

          consensus = parse_pct(ev.get("forecast"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              if consensus is not None: f.write(f"consensus={consensus}\n")
          print(f"consensus={consensus}")
          PY

      - name: Run BCCH predictor + POST to calendar-worker
        env:
          UPLOAD_AUTH_KEY: ${{ secrets.UPLOAD_AUTH_KEY }}
          CALENDAR_WORKER_URL: https://faractionradar-calendar.faractionradar.workers.dev
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BCCH_RELEASE_DATE: ${{ needs.gate.outputs.bcch_release_date }}
          BCCH_DAYS_OUT: ${{ needs.gate.outputs.bcch_days_out }}
          BCCH_CONSENSUS: ${{ steps.consensus.outputs.consensus }}
          MODEL_VERSION: v2-outcome-distribution
        run: python emit_bcch.py

      - name: Commit report + ledger row
        run: |
          git config user.name  "faractionradar-bot"
          git config user.email "bot@faractionradar.com"
          git add reports/ predictions.jsonl || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "BCCH prediction T-${{ needs.gate.outputs.bcch_days_out }} for ${{ needs.gate.outputs.bcch_release_date }}

          Auto-generated by predict-bcch workflow. v2-outcome-distribution."
          for i in 1 2 3 4 5; do
            if git push 2>&1; then exit 0; fi
            echo "push attempt $i failed, rebasing + retrying..."
            git pull --rebase --autostash 2>&1 || true
            sleep 3
          done
          echo "push failed after 5 attempts" >&2
          exit 1
