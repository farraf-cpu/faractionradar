name: Daily Proof (OpenTimestamps)

# Once a day: hash the calls published the previous UTC day, stamp the
# manifest with OpenTimestamps, commit it, and upload manifest + .ots to the
# calendar worker (served at calendar.faractionradar.com/calendar/proofs).
# Also upgrades pending proofs to their Bitcoin attestation and re-uploads them.

on:
  schedule:
    - cron: '23 0 * * *'
    - cron: '47 3 * * *'   # second slot; GitHub drops scheduled runs. Re-stamping a day is harmless.
  workflow_dispatch:
    inputs:
      day:
        description: 'UTC day to stamp (YYYY-MM-DD). Empty = yesterday.'
        required: false
      genesis:
        description: 'Stamp every call on record now (one-time genesis).'
        type: boolean
        required: false

permissions:
  contents: write

concurrency:
  group: daily-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Load code
        env:
          MODELS_DEPLOY_KEY: ${{ secrets.MODELS_DEPLOY_KEY }}
        run: |
          umask 077; printf '%s
' "$MODELS_DEPLOY_KEY" | tr -d '' > "$RUNNER_TEMP/mk"
          GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/mk -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git clone -q --depth 1 git@github.com:farraf-cpu/faractionradar-models.git .models
          rm -f "$RUNNER_TEMP/mk" && rm -rf .models/.git .models/.github && cp -rn .models/. . && rm -rf .models
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install opentimestamps-client
        run: pip install opentimestamps-client

      - name: Build manifest
        id: build
        run: |
          if [ "${{ github.event.inputs.genesis }}" = "true" ]; then
            f=$(python scripts/daily_proof.py --genesis)
          else
            f=$(python scripts/daily_proof.py ${{ github.event.inputs.day }})
          fi
          echo "file=$f" >> "$GITHUB_OUTPUT"

      - name: Stamp (skip if this exact manifest is already stamped)
        run: |
          f="${{ steps.build.outputs.file }}"
          if git diff --quiet -- "$f" 2>/dev/null && [ -f "$f.ots" ] && git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
            echo "manifest unchanged and already stamped"
          else
            rm -f "$f.ots"
            ots stamp "$f"
          fi

      - name: Upgrade pending proofs
        run: |
          shopt -s nullglob
          for p in proofs/calendar/*.ots; do ots upgrade "$p" || true; done

      - name: Commit
        run: |
          git config user.name  "faractionradar-bot"
          git config user.email "bot@faractionradar.com"
          git add proofs/calendar/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "proof: OpenTimestamps manifest $(basename ${{ steps.build.outputs.file }} .json)"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase --autostash || true
            sleep 3
          done
          exit 1

      - name: Upload to calendar worker
        env:
          UPLOAD_AUTH_KEY: ${{ secrets.UPLOAD_AUTH_KEY }}
        run: |
          python - <<'PY'
          import base64, glob, json, os, urllib.request
          for ots in sorted(glob.glob("proofs/calendar/*.json.ots")):
              man = ots[:-4]
              name = os.path.basename(man)[:-5]
              body = json.dumps({
                  "name": name,
                  "manifest": open(man, encoding="utf-8").read(),
                  "ots_b64": base64.b64encode(open(ots, "rb").read()).decode(),
              }).encode()
              req = urllib.request.Request(
                  "https://faractionradar-calendar.faractionradar.workers.dev/upload-proof",
                  data=body, method="POST",
                  headers={"content-type": "application/json",
                           "x-upload-auth": os.environ["UPLOAD_AUTH_KEY"],
                           "user-agent": "Mozilla/5.0 (X11; Linux x86_64; rv:129.0) Gecko/20100101 Firefox/129.0"})
              print(name, urllib.request.urlopen(req, timeout=60).status)
          PY
