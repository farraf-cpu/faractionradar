name: Predict FOMC

on:
  # Two daily fires:
  #   14:05 UTC — main cadence T-7/T-4/T-3/T-2/T-1 lock cycle
  #   16:00 UTC — T-0 pre-release refresh (~2h before 18:00 UTC FOMC);
  #     captures overnight Kalshi + last-hour speaker signals.
  #     Only fires when today is release day (gate handles).
  schedule:
    - cron: '5 14 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force_release_date:
        description: 'Override FOMC decision date (YYYY-MM-DD). Leave blank for auto.'
        required: false
      force_days_out:
        description: 'Override days_out (1|2|3|4|7). Leave blank for auto.'
        required: false

concurrency:
  group: predict-fomc
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      fomc_release_date: ${{ steps.check.outputs.fomc_release_date }}
      fomc_days_out: ${{ steps.check.outputs.fomc_days_out }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Decide if today is a FOMC predict day
        id: check
        run: |
          if [ -n "${{ github.event.inputs.force_release_date }}" ]; then
            echo "Manual override in effect"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "fomc_release_date=${{ github.event.inputs.force_release_date }}" >> "$GITHUB_OUTPUT"
            echo "fomc_days_out=${{ github.event.inputs.force_days_out }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python scripts/should_run_fomc.py; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  predict:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch live prediction-market implied FOMC rate
        id: market
        run: |
          curl -sSL -A "Mozilla/5.0 (X11; Linux x86_64; rv:129.0) Gecko/20100101 Firefox/129.0" \
               "https://faractionradar-calendar.faractionradar.workers.dev/public/kalshi-implied" \
               > /tmp/kalshi-implied.json || echo "curl failed"
          echo "response size: $(wc -c < /tmp/kalshi-implied.json) bytes"
          python - <<'PY'
          import json, os
          try:
              with open("/tmp/kalshi-implied.json") as f:
                  data = json.load(f)
              fomc = (data.get("implied") or {}).get("fomc")
              # Worker returns value_k = rate as percent (unit="rate_%") for FOMC.
              if fomc and isinstance(fomc.get("value_k"), (int, float)) and fomc.get("unit") == "rate_%":
                  v = float(fomc["value_k"])
                  print(f"kalshi implied FOMC: {fomc.get('display')} ({v}%, ticker={fomc.get('ticker')}, rungs={fomc.get('rungs_used')})")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write(f"pm_rate={v}\n")
                      f.write("pm_available=true\n")
              else:
                  print("kalshi implied FOMC not available — will proceed with current-rate anchor only")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write("pm_available=false\n")
          except Exception as e:
              print(f"parse failed: {e}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("pm_available=false\n")
          PY

      - name: Run FOMC predictor + POST to calendar-worker
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          UPLOAD_AUTH_KEY: ${{ secrets.UPLOAD_AUTH_KEY }}
          CALENDAR_WORKER_URL: https://faractionradar-calendar.faractionradar.workers.dev
          FOMC_RELEASE_DATE: ${{ needs.gate.outputs.fomc_release_date }}
          FOMC_DAYS_OUT: ${{ needs.gate.outputs.fomc_days_out }}
          FOMC_MARKET_RATE: ${{ steps.market.outputs.pm_rate }}
          MODEL_VERSION: v2-outcome-distribution
        run: python emit_fomc.py

      - name: Commit report + ledger row
        run: |
          git config user.name  "faractionradar-bot"
          git config user.email "bot@faractionradar.com"
          git add reports/ predictions.jsonl || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "FOMC prediction T-${{ needs.gate.outputs.fomc_days_out }} for ${{ needs.gate.outputs.fomc_release_date }}

          Auto-generated by predict-fomc workflow. v1-simple-blend — see reports/${{ needs.gate.outputs.fomc_release_date }}/... for details."
          for i in 1 2 3 4 5; do
            if git push 2>&1; then exit 0; fi
            echo "push attempt $i failed, rebasing + retrying..."
            git pull --rebase --autostash 2>&1 || true
            sleep 3
          done
          echo "push failed after 5 attempts" >&2
          exit 1
