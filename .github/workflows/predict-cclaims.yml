name: Predict Continuing Claims

on:
  # Daily at 15:30 UTC (next offset after UMich 15:25).
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      force_release_date:
        description: 'Override Continuing Claims release date (Thursday YYYY-MM-DD).'
        required: false
      force_days_out:
        description: 'Override days_out (1|2).'
        required: false

concurrency:
  group: predict-cclaims
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      cclaims_release_date: ${{ steps.check.outputs.cclaims_release_date }}
      cclaims_days_out: ${{ steps.check.outputs.cclaims_days_out }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Decide if today is a Continuing Claims predict day
        id: check
        run: |
          if [ -n "${{ github.event.inputs.force_release_date }}" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "cclaims_release_date=${{ github.event.inputs.force_release_date }}" >> "$GITHUB_OUTPUT"
            echo "cclaims_days_out=${{ github.event.inputs.force_days_out }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python scripts/should_run_cclaims.py; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  predict:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch live Continuing Claims consensus from calendar-worker
        id: consensus
        env:
          CALENDAR_AUTH_KEY: ${{ secrets.CALENDAR_AUTH_KEY }}
          CCLAIMS_RELEASE_DATE: ${{ needs.gate.outputs.cclaims_release_date }}
        run: |
          python - <<'PY'
          import json, os, re, sys, urllib.parse, urllib.request
          key = os.environ["CALENDAR_AUTH_KEY"]
          rel = os.environ["CCLAIMS_RELEASE_DATE"]
          url = ("https://faractionradar-calendar.faractionradar.workers.dev/"
                 f"?key={urllib.parse.quote(key)}&read")
          req = urllib.request.Request(url, headers={
              "user-agent": "Mozilla/5.0 (X11; Linux x86_64; rv:129.0) Gecko/20100101 Firefox/129.0",
          })
          data = json.loads(urllib.request.urlopen(req, timeout=30).read())
          events = data.get("events", [])

          def is_cclaims(title: str) -> bool:
              t = (title or "").strip().lower()
              return bool(re.match(r"^continuing\s+(jobless\s+)?claims$|^continued\s+claims$", t))

          matches = [
              e for e in events
              if e.get("country") == "USD"
              and is_cclaims(e.get("title") or "")
              and (e.get("date") or "").startswith(rel)
          ]

          if not matches:
              print(f"::notice::no Continuing Claims in worker /?read for {rel}")
              sys.exit(0)
          forecast = matches[0].get("forecast")
          if not forecast:
              print(f"::notice::CClaims event present but forecast null for {rel}")
              sys.exit(0)
          # FF format: "1.78M" or "1780K" — normalize to M
          s = forecast.strip()
          m = re.match(r"^([-+]?\d+(?:\.\d+)?)\s*[MmKk]?$", s)
          if not m:
              print(f"::error::unparseable CClaims forecast: {forecast!r}")
              sys.exit(1)
          v = float(m.group(1))
          # If K, convert to M
          if s[-1].upper() == "K":
              v = v / 1000.0
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"consensus_m={v}\n")
          print(f"consensus for CClaims {rel}: {v}M")
          PY

      - name: Run CClaims predictor + POST to calendar-worker
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          UPLOAD_AUTH_KEY: ${{ secrets.UPLOAD_AUTH_KEY }}
          CALENDAR_WORKER_URL: https://faractionradar-calendar.faractionradar.workers.dev
          CCLAIMS_RELEASE_DATE: ${{ needs.gate.outputs.cclaims_release_date }}
          CCLAIMS_DAYS_OUT: ${{ needs.gate.outputs.cclaims_days_out }}
          CCLAIMS_CONSENSUS_M: ${{ steps.consensus.outputs.consensus_m }}
          MODEL_VERSION: v1-simple-blend
        run: python emit_cclaims.py

      - name: Commit report + ledger row
        run: |
          git config user.name  "faractionradar-bot"
          git config user.email "bot@faractionradar.com"
          git add reports/ predictions.jsonl || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Continuing Claims prediction T-${{ needs.gate.outputs.cclaims_days_out }} for ${{ needs.gate.outputs.cclaims_release_date }}

          Auto-generated by predict-cclaims workflow. v1-simple-blend."
          git push
