name: Predict NFP

on:
  # Daily at 14:00 UTC (~09:00 ET, before market open). The gate script
  # decides whether today is T-7/T-4/T-3/T-2/T-1 from the next NFP Friday
  # and exits early if not.
  schedule:
    - cron: '0 14 * * *'
  # Manual override for backfills or ad-hoc runs
  workflow_dispatch:
    inputs:
      force_release_date:
        description: 'Override NFP release date (YYYY-MM-DD). Leave blank for auto.'
        required: false
      force_days_out:
        description: 'Override days_out (1|2|3|4|7). Leave blank for auto.'
        required: false

concurrency:
  group: predict-nfp
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      nfp_release_date: ${{ steps.check.outputs.nfp_release_date }}
      nfp_days_out: ${{ steps.check.outputs.nfp_days_out }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Decide if today is a predict day
        id: check
        run: |
          if [ -n "${{ github.event.inputs.force_release_date }}" ]; then
            echo "Manual override in effect"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "nfp_release_date=${{ github.event.inputs.force_release_date }}" >> "$GITHUB_OUTPUT"
            echo "nfp_days_out=${{ github.event.inputs.force_days_out }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if python scripts/should_run.py; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  predict:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so commits push cleanly
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run predictor + POST to calendar-worker
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          UPLOAD_AUTH_KEY: ${{ secrets.UPLOAD_AUTH_KEY }}
          CALENDAR_WORKER_URL: https://faractionradar-calendar.faractionradar.workers.dev
          NFP_RELEASE_DATE: ${{ needs.gate.outputs.nfp_release_date }}
          NFP_DAYS_OUT: ${{ needs.gate.outputs.nfp_days_out }}
          MODEL_VERSION: v1-bayesian-blend
        run: python emit.py

      - name: Commit report + ledger row
        run: |
          git config user.name  "faractionradar-bot"
          git config user.email "bot@faractionradar.com"
          git add reports/ predictions.jsonl data/raw/ data/processed/ || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "NFP prediction T-${{ needs.gate.outputs.nfp_days_out }} for ${{ needs.gate.outputs.nfp_release_date }}

          Auto-generated by predict-nfp workflow. See reports/${{ needs.gate.outputs.nfp_release_date }}/... for full model output."
          git push
